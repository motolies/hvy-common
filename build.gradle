plugins {
    id 'java'
    id 'java-library'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id "com.vanniktech.maven.publish" version "0.37.0"
}

group = 'kr.hvy'
version = project.findProperty('publishVersion') ?: 'local'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.register('delombok', JavaExec) {
    mainClass = 'lombok.launch.Main'
    doFirst {
        classpath = files(configurations.annotationProcessor)
        args 'delombok', 'src/main/java',
             '-d', layout.buildDirectory.dir('delombok').get().asFile.path,
             '--classpath', configurations.compileClasspath.asPath
    }
}

tasks.withType(Javadoc) {
    dependsOn delombok
    source = fileTree(layout.buildDirectory.dir('delombok')) { include '**/*.java' }
    exclude 'kr/hvy/common/domain/mapper/**'
    classpath = configurations.compileClasspath
    options {
        encoding 'UTF-8'
        // JDK 25 doclint 가 기존 주석의 <T>/<User> 같은 제네릭 표기를 HTML 태그 오류로 판정하므로 doclint 비활성화
        addStringOption('Xdoclint:none', '-quiet')
    }
}

// Maven Publishing 블록 설정
mavenPublishing {
    // 서명 키가 있는 환경(로컬)에서만 서명 — CI(GH Packages 배포)에는 GPG 키가 없으므로 서명 생략
    if (project.hasProperty('signing.keyId')) {
        signAllPublications() // Gpg 서명을 위한 설정
    }
    publishToMavenCentral(true) // Central Portal + 자동 릴리스

    coordinates("io.github.motolies", "hvy-common", version as String) // 네임 스페이스, 라이브러리 이름, 버전 순서로 작성

    // POM 설정
    pom {
        /**
         name = '[라이브러리 이름]'
         description = '[라이브러리 설명]'
         url = '[오픈소스 Repository Url]'
         */
        name = 'hvy-common'
        description = 'A collection of common codes for me'
        url = '<https://github.com/motolies/hvy-common>'

        // 라이선스 정보
        licenses {
            license {
                name = 'MIT License'
                url = '<https://opensource.org/license/mit/>'
            }
        }

        // 개발자 정보
        developers {
            developer {
                id = 'motolies'
                name = 'Namwon Kim'
                email = 'knw1234@gmail.com'
                organization = 'hvy'
                organizationUrl = '<https://hvy.kr>'
            }
        }

        /**
         connection = 'scm:git:github.com/[Github 사용자명]/[오픈소스 Repository 이름].git'
         developerConnection = 'scm:git:ssh://github.com/[Github 사용자명]/[오픈소스 Repository 이름].git'
         url = '<https://github.com/>[Github 사용자명]/[오픈소스 Repository 이름]/tree/[배포 브랜치명]'
         */
        scm {
            connection = 'scm:git:github.com/motolies/hvy-common.git'
            developerConnection = 'scm:git:ssh://github.com:motolies/hvy-common.git'
            url = '<https://github.com/motolies/hvy-common/tree/master>'
        }
    }
}

// GitHub Packages 배포 대상 — Central 동기화 지연 없이 즉시 소비 가능
// 배포: ./gradlew publishAllPublicationsToGitHubPackagesRepository -PpublishVersion=X.Y.Z
publishing {
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/motolies/hvy-common')
            credentials {
                username = project.findProperty('gpr.user') ?: System.getenv('GHP_USER')
                password = project.findProperty('gpr.key') ?: System.getenv('GHP_TOKEN')
            }
        }
    }
}


configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'   // Boot 4: starter-web → starter-webmvc
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'  // Boot 4.1: starter-aop 삭제 → starter-aspectj (@Aspect 위빙)
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // DataRedisProperties(RedisConfigurer) 컴파일 참조 — Boot 4 는 spring-boot-data-redis 모듈 소속이라 전이로 오지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'
    // BasePage 의 @Min 컴파일 참조 — 삭제된 spring-cloud-stream 이 starter-validation 을 전이로 끌어오고 있었음 (버전은 Boot BOM 위임)
    api 'jakarta.validation:jakarta.validation-api'

    // slack
    api 'com.slack.api:bolt:1.50.0'

    // jdbc proxy
    api 'net.ttddyy:datasource-proxy:1.11.0'

    // apache commons (httpclient5 / commons-lang3 는 Boot BOM 위임)
    api 'org.apache.httpcomponents.client5:httpclient5'
    api 'org.apache.commons:commons-lang3'
    api 'org.apache.commons:commons-collections4:4.6.0'
    api 'org.apache.commons:commons-text:1.15.0'
    api 'commons-io:commons-io:2.22.0'

    // guava (33.7.1+ 는 JDK 25 sun.misc.Unsafe 경고 없음)
    api 'com.google.guava:guava:33.7.1-jre'

    // shedlock scheduler
    api 'net.javacrumbs.shedlock:shedlock-spring:7.9.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.9.0'

    // cache (caffeine 은 Boot BOM 위임)
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    api 'com.github.ben-manes.caffeine:caffeine'

    // logging
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Boot 4 는 actuator 스타터가 트레이싱 auto-config 를 끌어오지 않는다 → OTel 브리지 + Zipkin 내보내기 auto-config 모듈 명시
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-zipkin'
    // 벤더 중립 facade(io.micrometer.tracing.Tracer)만 코드에서 사용한다 — 브리지 교체 시 코드 무변경.
    // api 인 이유: ApiLogInterceptor public 생성자가 Tracer 타입을 노출하므로 소비 모듈 컴파일에 필요
    // (위 모듈 안에서는 optional 의존이라 명시하지 않으면 Tracer 빈이 생성되지 않는다)
    api 'io.micrometer:micrometer-tracing-bridge-otel'
    // Zipkin 전송 구현체 — management.tracing.export.zipkin.endpoint 설정을 그대로 사용한다 (버전은 Boot BOM 위임)
    implementation 'io.opentelemetry:opentelemetry-exporter-zipkin'
    api 'net.logstash.logback:logstash-logback-encoder:9.0'   // 9.0 부터 Jackson 3 기반

    // implementation 대신 api를 사용하면 다른 모듈에서도 사용 가능
    // tsid (hibernate-73 = Hibernate 7.4.x, Jackson 3 모듈)
    api 'io.hypersistence:hypersistence-utils-hibernate-73:3.15.5'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // SimpleTracer — 실제 트레이싱 SDK 없이 Tracer 계약을 테스트한다 (버전은 Boot BOM 위임)
    testImplementation 'io.micrometer:micrometer-tracing-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // mapStruct
    // mapstruct가 lombok 뒤에 있어야 함
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3' // mapstruct가 lombok 뒤에 있어야 함?
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0' // lombok → mapstruct 프로세서 순서 보장
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += '-Xlint:deprecation'
}

tasks.named('test') {
    useJUnitPlatform()
    // 테스트 JVM 타임존 고정 — 개발머신(KST)/CI 환경 차이에 의한 flaky 방지
    systemProperty 'user.timezone', System.getProperty('user.timezone', 'UTC')
    // JDK 21+ 에서 Mockito 인라인 목 에이전트 self-attach 경고 제거
    jvmArgs '-XX:+EnableDynamicAgentLoading'
}

// bootJar 비활성화
tasks.named('bootJar') {
    enabled = false
}

// 일반 JAR 빌드를 위한 설정
tasks.named('jar') {
    enabled = true
    archiveBaseName = 'hvy-common'
    archiveVersion = project.version
}
